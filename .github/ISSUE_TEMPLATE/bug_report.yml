name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A DSL snippet that reproduces it, or a share link
        (Export → Share), is the fastest way to get this fixed.
      placeholder: |
        flowchart LR

        A -> B
        B -> C
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 129 on macOS 15
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything in the browser dev tools console (F12)?
    validations:
      required: false