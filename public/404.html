<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flowgio</title>

    <!--
      GitHub Pages serves this file for any path that isn't a real
      static file (e.g. a deep link like /flowgio/editor, since
      only /flowgio/index.html actually exists after the build).

      This is the standard SPA-on-GitHub-Pages redirect: encode the
      real path into a query string and send the browser back to the
      app's index.html, which decodes it back into a normal URL via
      history.replaceState before Vue Router ever sees it — see the
      matching inline script in index.html.

      Based on https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      // Number of path segments that make up the GitHub Pages
      // project base (e.g. "/flowgio" -> 1). Set this to 0 if
      // deploying to a user/org root page (username.github.io).
      var pathSegmentsToKeep = 1;

      var l = window.location;

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
