<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devcanvas</title>

    <!--
      Matching half of the public/404.html redirect trick (public/gh-pages-redirect.js,
      an external file so the CSP can stay free of inline scripts): decode a
      path GitHub Pages redirected here (as ?/real/path) back into a
      normal URL via history.replaceState, before Vue Router reads
      the location. No-op on every host other than GitHub Pages,
      where the query string never has this shape.
    -->
    <script src="/gh-pages-redirect.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
